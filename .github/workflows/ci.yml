name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current
            node: 22
            prisma: ''
          - label: prisma-floor
            node: 22
            prisma: '7.2.0'
          - label: node-20
            node: 20
            prisma: ''

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cachetags
          POSTGRES_PASSWORD: cachetags
          POSTGRES_DB: cachetags
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cachetags"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://cachetags:cachetags@localhost:5432/cachetags
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pin Prisma to the peer floor
        if: matrix.prisma != ''
        run: pnpm add -D prisma@${{ matrix.prisma }} @prisma/client@${{ matrix.prisma }} @prisma/adapter-pg@${{ matrix.prisma }}

      - run: pnpm exec prisma generate
      - run: pnpm exec prisma db push

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm test:e2e

      - name: Assert no host-application coupling leaked into the package
        run: |
          if grep -rin "kitcompass" src/; then
            echo "Host-application identifiers found in src/"
            exit 1
          fi
